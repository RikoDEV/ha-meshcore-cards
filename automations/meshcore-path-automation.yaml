alias: "MeshCore Bot: Path"
description: Responds to `es path` on channel with repeater names, one per line
triggers:
  - trigger: event
    event_type: meshcore_message
    event_data:
      message_type: channel
      channel_idx: 2
conditions:
  - condition: template
    value_template: >-
      {{ (trigger.event.data.message | default('') | lower).startswith('es path') }}
actions:
  - variables:
      d: "{{ trigger.event.data }}"
      rx0: >-
        {{ d.rx_log_data[0] if (d.rx_log_data is defined and d.rx_log_data | length > 0) else {} }}
      path_hex: "{{ rx0.path if rx0.path is defined else '' }}"
      reply_text: |
        {# Build pubkey_short → adv_name map from contact diagnostic entities #}
        {% set ns = namespace(map={}) %}
        {% for s in states.binary_sensor %}
          {% if s.attributes.pubkey_short is defined and s.attributes.adv_name is defined %}
            {% set pk2 = s.attributes.pubkey_short | upper %}
            {% set ns.map = ns.map | combine({pk2: s.attributes.adv_name}) %}
          {% endif %}
        {% endfor %}
        {# Build reply lines; enforce 200-char MeshCore message cap #}
        {% set header = '@[' + (d.sender | default('')) + ']' %}
        {% if path_hex | length < 2 %}
          {{ header }}
          direct (no repeaters)
        {% else %}
          {% set out = namespace(lines=[header], used=header | length) %}
          {% for i in range(0, path_hex | length, 2) %}
            {% set seg = (path_hex[i:i+2]) | upper %}
            {% set name = ns.map[seg] if seg in ns.map else '?' %}
            {% set line = seg ~ ': ' ~ name %}
            {% if out.used + 1 + (line | length) <= 200 %}
              {% set out.lines = out.lines + [line] %}
              {% set out.used = out.used + 1 + (line | length) %}
            {% endif %}
          {% endfor %}
          {{ out.lines | join('\n') }}
        {% endif %}
  - data:
      channel_idx: 2
      message: "{{ reply_text | trim }}"
    action: meshcore.send_channel_message
